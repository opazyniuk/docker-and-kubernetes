apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
  labels:
    app: promtail
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: demo-app-direct
        static_configs:
          - targets:
              - localhost
            labels:
              job: demo-app-direct
              app: demo-app
              namespace: demo
              __path__: /var/log/containers/*demo*.log
