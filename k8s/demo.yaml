apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: demo-container
        image: opazyniuk/python-app:hw-8
        ports:
        - containerPort: 5000
        env:
        - name: BACKGROUND_COLOR
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: BACKGROUND_COLOR
        - name: FIB_NUMBER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: FIB_NUMBER
        - name: USE_POSTGRES
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: USE_POSTGRES
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_HOST
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_PASSWORD
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
          - name: static
            mountPath: /app/static
      volumes:
        - name: static
          persistentVolumeClaim:
            claimName: demo-static-pvc

